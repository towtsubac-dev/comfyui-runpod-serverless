name: Fix H3 extension input audio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix H3 extension input audio handling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch handler
        run: |
          python -c "import base64; from pathlib import Path; p=Path('handler.py'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'target block not found'; p.write_text(s.replace(old,new,1))"
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add handler.py
          git commit -m 'Fix H3 extension input audio handling'
          git push
