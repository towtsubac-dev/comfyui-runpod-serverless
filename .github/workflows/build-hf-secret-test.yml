name: Build H3 authenticated download test

on:
  push:
    branches:
      - test/hf-build-secret

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push isolated test image
        uses: docker/build-push-action@v6
        env:
          HF_BUILD_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          context: .
          push: true
          secret-envs: |
            hf_token=HF_BUILD_TOKEN
          tags: ghcr.io/${{ github.repository_owner }}/comfyui-runpod-serverless:hf-build-secret-test
