name: FL2VA-only Ref2VA Feasibility
on:
  push:
    branches:
      - experiment/h3-fl2va-ref2va-no-extra-model
    paths:
      - Dockerfile
      - handler.py
      - ref2va_handler.py
      - tests/test_ref2va_preview.py
      - tests/test_fl2va_ref2va_contract.py
      - .github/workflows/fl2va-ref2va-feasibility.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Check Python syntax
        run: python -m py_compile handler.py ref2va_handler.py tests/test_ref2va_preview.py tests/test_fl2va_ref2va_contract.py
      - name: Check native reference workflow and production mode contracts
        run: |
          python -m unittest discover -s tests -p test_ref2va_preview.py -v
          python -m unittest discover -s tests -p test_fl2va_ref2va_contract.py -v
