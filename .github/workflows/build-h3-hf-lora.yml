name: Build H3 HF LoRA candidate (isolated GHCR tag)

on:
  push:
    branches:
      - release/h3-fl2va-ref2va-prod-v1
    paths:
      - .github/workflows/build-h3-hf-lora.yml
      - Dockerfile
      - handler.py
      - ref2va_handler.py
      - lora_url_policy.py
      - tests/test_lora_url_policy.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-h3-hf-lora-candidate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free runner space for H3 weights
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push isolated versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/comfyui-runpod-serverless:h3-hf-lora-v1
          provenance: false
