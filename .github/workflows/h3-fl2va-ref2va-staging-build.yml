name: Build H3 FL2VA Ref2VA Staging
on:
  push:
    branches:
      - release/h3-fl2va-ref2va-prod-v1
    paths:
      - .github/workflows/h3-fl2va-ref2va-staging-build.yml
      - Dockerfile
      - handler.py
      - ref2va_handler.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: h3-fl2va-ref2va-staging-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Free runner disk for full H3 checkpoint
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Unique staging tag (never latest or v1)
        id: tag
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:h3-fl2va-ref2va-staging-${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"

      - name: Build and push isolated staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.name }}
          provenance: false

      - name: Show image for staging endpoint
        run: echo "Built ${{ steps.tag.outputs.name }}"
