name: MiniMax H3 All-Modes Ref2VA Feasibility Checks
on:
  push:
    branches:
      - feature/h3-prod-multimode-ref2va
    paths:
      - handler.py
      - ref2va_handler.py
      - Dockerfile
      - tests/test_ref2va_preview.py
      - tests/test_h3_multimode_contract.py
      - .github/workflows/h3-multimode-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Check Python syntax
        run: python -m py_compile handler.py ref2va_handler.py tests/test_ref2va_preview.py tests/test_h3_multimode_contract.py
      - name: Test Ref2VA graph and old-mode routing
        run: |
          python -m unittest discover -s tests -p test_ref2va_preview.py -v
          python -m unittest discover -s tests -p test_h3_multimode_contract.py -v
